<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumping Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-wrapper">
      <h1>Jump the Cactus 🌵</h1>

      <div class="score-board">
        <span>Score: <span id="score">0</span></span>
        <span>High Score: <span id="high-score">0</span></span>
      </div>
      <div class="game-container">
        <div class="player"></div>
        <div class="ground"></div>

        <div class="game-over hidden">
          <p>Game Over!</p>
          <div class="final-score">Final Score: 0</div>
          <button id="restart-btn">Restart</button>
        </div>
        <div id="start-screen">
          <p>Press SPACE or click Start to jump!</p>
          <button id="start-btn">Start Game</button>
        </div>
      </div>
      <p class="instructions">
        Press <strong>Spacebar</strong> or <strong>Up Arrow</strong> to jump
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
